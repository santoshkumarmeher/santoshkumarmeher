<svg width="1000" height="24" viewBox="0 0 1000 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#24c6dc" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#24c6dc"/>
      <stop offset="0.8" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="12" x2="1000" y2="12" stroke="url(#g)" stroke-width="2"/>
  <line x1="0" y1="12" x2="1000" y2="12" stroke="#ffffff" stroke-width="2" stroke-dasharray="40 960" stroke-linecap="round" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="40" to="-960" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle cy="12" r="5" fill="#24c6dc">
    <animate attributeName="cx" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;7;3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="12" r="6" fill="none" stroke="#a855f7" stroke-width="2">
    <animate attributeName="r" values="4;14;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
