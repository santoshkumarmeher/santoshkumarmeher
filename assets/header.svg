<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0820"/><stop offset="0.55" stop-color="#241f55"/><stop offset="1" stop-color="#07202e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#24c6dc"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24c6dc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#24c6dc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#24c6dc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#24c6dc" stop-opacity="0.35"/><stop offset="1" stop-color="#24c6dc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#24c6dc" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="300" rx="18"/></clipPath>
    <clipPath id="type"><rect x="60" y="196" height="40" width="0">
      <animate attributeName="width" values="0;600;600;0" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- moving grid -->
    <g>
      <rect x="-40" y="-40" width="1080" height="380" fill="url(#grid)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- pulsing glow orbs -->
    <circle cx="840" cy="80" r="170" fill="url(#glow)">
      <animate attributeName="r" values="140;190;140" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="260" r="140" fill="#a855f7" fill-opacity="0.14">
      <animate attributeName="fill-opacity" values="0.08;0.22;0.08" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- circuit lines with flowing dashes -->
    <g fill="none" stroke="url(#neon)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 18" opacity="0.8">
      <path d="M600 40 H700 L730 70 H900 L930 40 H1000">
        <animate attributeName="stroke-dashoffset" from="64" to="0" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M640 260 H740 L770 230 H940">
        <animate attributeName="stroke-dashoffset" from="0" to="64" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M0 150 H60 L90 120 H200">
        <animate attributeName="stroke-dashoffset" from="64" to="0" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#24c6dc">
      <circle cx="730" cy="70" r="4"><animate attributeName="r" values="3;7;3" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="40" r="4"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="230" r="4"><animate attributeName="r" values="3;7;3" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="120" r="4"><animate attributeName="r" values="3;7;3" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating code particles -->
    <g fill="#24c6dc" font-size="16" opacity="0.55">
      <text x="520" y="320">01<animate attributeName="y" from="320" to="-20" dur="7s" begin="-1s" repeatCount="indefinite"/></text>
      <text x="580" y="320">&lt;/&gt;<animate attributeName="y" from="320" to="-20" dur="9s" begin="-4s" repeatCount="indefinite"/></text>
      <text x="660" y="320">{ }<animate attributeName="y" from="320" to="-20" dur="8s" begin="-2s" repeatCount="indefinite"/></text>
      <text x="780" y="320">10110<animate attributeName="y" from="320" to="-20" dur="10s" begin="-6s" repeatCount="indefinite"/></text>
      <text x="860" y="320">def()<animate attributeName="y" from="320" to="-20" dur="7.5s" begin="-3s" repeatCount="indefinite"/></text>
      <text x="930" y="320">=&gt;<animate attributeName="y" from="320" to="-20" dur="6.5s" begin="-5s" repeatCount="indefinite"/></text>
      <text x="470" y="320">0xFF<animate attributeName="y" from="320" to="-20" dur="11s" begin="-8s" repeatCount="indefinite"/></text>
      <text x="720" y="320">git<animate attributeName="y" from="320" to="-20" dur="9.5s" begin="-7s" repeatCount="indefinite"/></text>
    </g>

    <!-- scan line -->
    <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
      <animate attributeName="y" from="-60" to="300" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- top bar -->
    <g font-size="13" fill="#7dd3e8">
      <circle cx="30" cy="28" r="6" fill="#ff5f56"/><circle cx="52" cy="28" r="6" fill="#ffbd2e"/><circle cx="74" cy="28" r="6" fill="#27c93f"/>
      <text x="100" y="33" opacity="0.8">santosh@dev:~$ ./boot --profile</text>
    </g>

    <!-- name with glitch layers -->
    <g font-size="58" font-weight="700">
      <text x="60" y="140" fill="#ff2e97" opacity="0.75">
        SANTOSH KUMAR MEHER
        <animate attributeName="x" values="60;60;60;66;54;60;60;60;60;58;60" keyTimes="0;0.5;0.6;0.62;0.64;0.66;0.8;0.9;0.92;0.94;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="140" fill="#24c6dc" opacity="0.75">
        SANTOSH KUMAR MEHER
        <animate attributeName="x" values="60;60;60;54;67;60;60;60;60;63;60" keyTimes="0;0.5;0.6;0.62;0.64;0.66;0.8;0.9;0.92;0.94;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="140" fill="#ffffff">SANTOSH KUMAR MEHER</text>
    </g>

    <!-- role line -->
    <text x="60" y="178" font-size="20" fill="url(#neon)" font-weight="600">SOFTWARE DEVELOPER  //  FULL STACK  //  CLOUD</text>

    <!-- typed line -->
    <g clip-path="url(#type)">
      <text x="60" y="224" font-size="22" fill="#9be8f5">&gt; Python | Flutter | Web | Automation</text>
    </g>
    <rect y="204" width="12" height="26" fill="#24c6dc">
      <animate attributeName="x" values="60;660;660;60" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <!-- status HUD -->
    <g font-size="13" fill="#24c6dc" text-anchor="end">
      <circle cx="900" cy="268" r="5" fill="#27c93f"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="970" y="273">STATUS: ONLINE  |  BUILDING</text>
    </g>

    <!-- HUD corners -->
    <g fill="none" stroke="#24c6dc" stroke-width="3" opacity="0.9">
      <path d="M10 40 V10 H40"/><path d="M960 10 H990 V40"/><path d="M10 260 V290 H40"/><path d="M960 290 H990 V260"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="2"/>
</svg>
